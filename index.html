<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2F8F63">
<title>炫炫炫的工作日记</title>
<style>
/* ==================== 主题变量：浅绿色（默认浅色）+ 深色模式 ==================== */
:root{
  --bg:#EEF7F0;            /* 页面背景 */
  --card:#FFFFFF;          /* 卡片背景 */
  --field:#F6FBF7;         /* 输入框背景 */
  --text:#26332A;          /* 主文字 */
  --sub:#7C8F83;           /* 次要文字 */
  --line:#DCEBE0;          /* 边框线 */
  --accent:#66C79B;        /* 主强调色（薄荷绿） */
  --accent2:#B7E4C7;       /* 次强调色 */
  --accent3:#9FD8E0;       /* 辅助色 */
  --primary:#2F8F63;       /* 主按钮 */
  --primary-text:#F2FFF8;
  --danger:#E8786F;        /* 危险色 */
  --warn:#E9B44C;
  --ok:#4FBF8B;
  --p1:#66C79B; --p2:#9FD8E0; --p3:#E9B44C; --p4:#E8786F; --p5:#B69BE0;
  --shadow:0 8px 22px rgba(47,143,99,.10);
  --r:18px;
}
html[data-theme="dark"]{
  --bg:#111A15;
  --card:#1A251F;
  --field:#20302A;
  --text:#E3F2E9;
  --sub:#8DA79A;
  --line:#2B3D34;
  --accent:#6FD3A6;
  --accent2:#2E5544;
  --accent3:#2C4F59;
  --primary:#6FD3A6;
  --primary-text:#0E1D16;
  --danger:#E8786F;
  --warn:#E9B44C;
  --ok:#6FD3A6;
  --p1:#6FD3A6; --p2:#7FC6D4; --p3:#E9B44C; --p4:#E8786F; --p5:#B69BE0;
  --shadow:0 8px 22px rgba(0,0,0,.38);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;
  /* 柔和圆点底纹 */
  background-image:radial-gradient(rgba(102,199,155,.13) 1.5px,transparent 1.5px);
  background-size:24px 24px;
  font-size:15px;line-height:1.5;
}
html[data-theme="dark"] body{background-image:radial-gradient(rgba(111,211,166,.06) 1.5px,transparent 1.5px)}

/* ==================== 顶栏 ==================== */
.topbar{
  position:fixed;top:0;left:0;right:0;height:56px;z-index:30;
  display:flex;align-items:center;gap:10px;padding:0 12px;
  padding-top:env(safe-area-inset-top);height:calc(56px + env(safe-area-inset-top));
  background:var(--card);border-bottom:1px solid var(--line);
}
.topbar .title{font-size:17px;font-weight:800;flex:1;text-align:center}
.topbar .title small{display:block;font-size:11px;font-weight:400;color:var(--sub);letter-spacing:.5px}
.icon-btn{
  width:42px;height:42px;flex:0 0 auto;border-radius:50%;font-size:18px;cursor:pointer;
  background:var(--field);color:var(--text);border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;transition:transform .12s;
}
.icon-btn:active{transform:scale(.92)}

/* ==================== 侧边抽屉导航 ==================== */
.drawer{
  position:fixed;top:0;left:0;bottom:0;width:238px;z-index:40;
  background:var(--card);border-right:1px solid var(--line);
  transform:translateX(-105%);transition:transform .26s cubic-bezier(.4,0,.2,1);
  padding:calc(14px + env(safe-area-inset-top)) 10px calc(14px + env(safe-area-inset-bottom));
  overflow-y:auto;display:flex;flex-direction:column;
}
.drawer.open{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.16)}
.drawer .brand{font-size:16px;font-weight:800;padding:4px 12px 12px;color:var(--primary)}
.drawer .brand small{display:block;font-size:11px;color:var(--sub);font-weight:400;margin-top:2px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:11px 13px;margin-bottom:2px;
  border-radius:12px;font-size:15px;cursor:pointer;color:var(--text);user-select:none;
  min-height:46px;transition:background .15s;
}
.nav-item .ico{font-size:17px;width:22px;text-align:center}
.nav-item:active{background:var(--bg)}
.nav-item.on{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#1B3A2B;font-weight:700}
html[data-theme="dark"] .nav-item.on{color:#0E1D16}
.drawer .foot{margin-top:auto;padding:12px;font-size:11px;color:var(--sub);line-height:1.6}
.mask{
  position:fixed;inset:0;background:rgba(15,30,20,.38);z-index:35;
  opacity:0;pointer-events:none;transition:opacity .26s;
}
.mask.show{opacity:1;pointer-events:auto}
/* 桌面端：侧边栏常驻 */
@media(min-width:920px){
  .drawer{transform:none;box-shadow:none}
  .mask{display:none}
  #btnMenu{display:none}
  .topbar{left:238px}
  .topbar .title{font-size:19px}
  main{margin-left:238px;max-width:900px}
}

/* ==================== 主区域 ==================== */
main{padding:calc(70px + env(safe-area-inset-top)) 12px calc(28px + env(safe-area-inset-bottom));
     max-width:780px;margin:0 auto}
.page{display:none;animation:fade .22s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px;gap:8px}
.page-head h2{font-size:18px}
.page-head .hint{font-size:12px;color:var(--sub)}

/* ==================== 卡片 ==================== */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:14px;margin-bottom:14px;
}
.card h3{font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.card h3 .tag{margin-left:auto}
.sub{font-size:12px;color:var(--sub)}
.card>.row,.card>.grid2,.card>.grid3,.card>.btn,.card>canvas,.card>.mt,
.card>label,.card>.list,.card>.kcal,.card>.prog,.card>.empty,.card>p{margin-top:8px}
.center{text-align:center}
.mt{margin-top:8px}
.mt-lg{margin-top:14px}
.pre{white-space:pre-wrap;word-break:break-word}
.muted{color:var(--sub)}
.nowrap{white-space:nowrap}

/* ==================== 表单控件（触控友好，最小 46px） ==================== */
input,select,textarea{
  width:100%;min-height:46px;padding:9px 11px;font-size:15px;font-family:inherit;
  color:var(--text);background:var(--field);border:1.5px solid var(--line);border-radius:11px;outline:none;
  transition:border-color .15s;
}
textarea{min-height:78px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);
  background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
label.fl{display:block;font-size:13px;color:var(--sub);margin-top:10px}
label.fl>span{display:block;margin-bottom:4px}
label.fl input,label.fl select,label.fl textarea{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2>*,.grid3>*{min-width:0}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0;flex:1}
.row>.btn{flex:0 0 auto}
.row>.btn.block{flex:1 1 auto}
.grow{flex:1}

/* ==================== 按钮 ==================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:46px;padding:0 18px;border:none;border-radius:999px;cursor:pointer;
  background:var(--primary);color:var(--primary-text);font-size:15px;font-weight:600;
  font-family:inherit;transition:transform .12s,opacity .12s;white-space:nowrap;
}
.btn:active{transform:scale(.95)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--text);font-weight:500}
.btn.danger{background:var(--danger);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.small{min-height:36px;padding:0 13px;font-size:13px;border-radius:10px;flex:0 0 auto;font-weight:500}
.btn.block{width:100%}
.btn:disabled{opacity:.45}

/* ==================== 列表项 ==================== */
.list{margin-top:8px}
.item{
  display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:13px;
  background:var(--field);border:1px solid var(--line);margin-bottom:8px;
}
.item-main{flex:1;min-width:0}
.item-main .t{font-size:15px;word-break:break-word}
.item-main .t.done{text-decoration:line-through;color:var(--sub)}
.item-main .m{font-size:12px;color:var(--sub);margin-top:2px;display:flex;flex-wrap:wrap;gap:8px}
.item-actions{display:flex;gap:6px;flex:0 0 auto;align-items:center}
.mini{
  width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);
  color:var(--text);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.mini:active{background:var(--bg)}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:22px 8px;line-height:1.8}
.empty .big{font-size:30px;display:block;margin-bottom:6px}

/* 复选框 */
.check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;padding:2px 0}
.check .box{
  width:24px;height:24px;flex:0 0 auto;border-radius:8px;border:2px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;transition:all .15s;
}
.check.on .box{background:var(--accent);border-color:var(--accent);color:#12351F}
.check.on .lb{text-decoration:line-through;color:var(--sub)}
.check .lb{font-size:15px;word-break:break-word}

/* 标签 / 分段控制器 */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  padding:7px 14px;border-radius:999px;font-size:13px;border:1.5px solid var(--line);
  background:var(--field);color:var(--text);cursor:pointer;user-select:none;min-height:36px;display:flex;align-items:center;
}
.chip.on{background:var(--accent);border-color:var(--accent);color:#12351F;font-weight:700}
.tag{
  font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent2);color:#1B3A2B;
  display:inline-block;line-height:1.7;
}
html[data-theme="dark"] .tag{color:#CFEEDD}
.tag.warn{background:rgba(233,180,76,.25);color:#96701F}
html[data-theme="dark"] .tag.warn{color:var(--warn)}
.tag.danger{background:rgba(232,120,111,.2);color:#B4463D}
html[data-theme="dark"] .tag.danger{color:#F09189}
.tag.gray{background:var(--field);color:var(--sub);border:1px solid var(--line)}

/* 统计 KPI */
.kcal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kcal.c2{grid-template-columns:repeat(2,1fr)}
.kpi{background:var(--field);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.kpi b{display:block;font-size:19px;color:var(--primary);word-break:break-all}
.kpi span{font-size:11px;color:var(--sub)}

/* 进度条 */
.prog{height:10px;border-radius:999px;background:var(--field);border:1px solid var(--line);overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent3));border-radius:999px;transition:width .4s}

/* 星级 */
.stars{display:flex;gap:2px;font-size:20px;cursor:pointer}
.stars .s{color:var(--line);transition:transform .1s;line-height:1}
.stars .s.on{color:var(--warn)}
.stars .s:active{transform:scale(1.2)}

/* 日历网格 */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal-head .ym{flex:1;text-align:center;font-weight:700;font-size:16px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-wk{font-size:11px;color:var(--sub);text-align:center;padding:4px 0}
.cal-cell{
  position:relative;aspect-ratio:1/1;border-radius:11px;background:var(--field);border:1px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:13px;
}
.cal-cell.other{opacity:.32}
.cal-cell.today{background:var(--accent);color:#12351F;font-weight:800}
.cal-cell.sel{border-color:var(--primary);font-weight:700}
.cal-cell .dot{width:5px;height:5px;border-radius:50%;background:var(--danger);position:absolute;bottom:5px}
.cal-cell .dot.todo{background:var(--accent3);bottom:5px;left:calc(50% - 5px)}
.cal-cell .dot.todo.solo{left:auto}
.cal-cell .em{font-size:15px;line-height:1}
.cal-cell .n{font-size:10px}

/* 心情格子 */
.mood-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mood-pick{display:flex;gap:6px;flex-wrap:wrap}
.mood-pick .m{
  width:46px;height:46px;border-radius:13px;border:2px solid var(--line);background:var(--field);
  font-size:23px;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.mood-pick .m.on{border-color:var(--accent);background:var(--accent2);transform:scale(1.06)}

/* 密码行 */
.pw-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--field);border:1px solid var(--line);border-radius:13px;margin-bottom:8px}
.pw-row .info{flex:1;min-width:0}
.pw-row .info .n{font-weight:700;font-size:15px}
.pw-row .info .a{font-size:12px;color:var(--sub);word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace}
.pw-row .info .p{font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5px;color:var(--primary)}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translate(-50%,16px);
  background:rgba(28,48,38,.94);color:#EAFBF2;padding:11px 20px;border-radius:999px;font-size:14px;
  z-index:60;opacity:0;pointer-events:none;transition:all .25s;max-width:85vw;text-align:center;
}
html[data-theme="dark"] .toast{background:rgba(230,245,238,.95);color:#12211A}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 弹窗 */
.modal-mask{
  position:fixed;inset:0;background:rgba(15,30,20,.45);z-index:50;display:flex;align-items:center;justify-content:center;
  padding:16px;opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-mask.show{opacity:1;pointer-events:auto}
.modal{
  background:var(--card);border-radius:var(--r);width:100%;max-width:420px;max-height:86vh;overflow-y:auto;
  padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.3);transform:translateY(8px);transition:transform .2s;
}
.modal-mask.show .modal{transform:none}
.modal-title{font-size:16px;margin-bottom:10px}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions .btn{flex:1}
.mform{margin-top:4px}
.list-scroll{max-height:340px;overflow-y:auto;padding-right:2px}
</style>
</head>
<body>

<!-- ========== 顶栏 ========== -->
<header class="topbar">
  <button class="icon-btn" id="btnMenu" aria-label="打开菜单">☰</button>
  <div class="title" id="pageTitle">今日待办<small>炫炫炫的工作日记</small></div>
  <button class="icon-btn" id="btnTheme" aria-label="切换深色模式">🌙</button>
</header>

<!-- ========== 侧边抽屉导航 ========== -->
<nav class="drawer" id="drawer">
  <div class="brand">🌿 炫炫炫的工作日记<small>你的私人生活工作台</small></div>
  <div id="navList"></div>
  <div class="foot">数据全部保存在本机浏览器（localStorage），不上传服务器，离线可用。<br>清除浏览器缓存会丢失全部数据。</div>
</nav>
<div class="mask" id="mask"></div>

<!-- ========== 主内容区 ========== -->
<main id="main"></main>

<div class="toast" id="toast"></div>
<div class="modal-mask" id="modalMask"><div class="modal" id="modal"></div></div>

<script>
/* =========================================================================
   炫炫炫的工作日记 —— 单文件本地工作台
   技术：原生 HTML + CSS + JavaScript，无任何外部依赖；图表使用 Canvas 绘制
   数据：localStorage 单键存储，离线可用
   ========================================================================= */

/* ---------------- 1. 通用工具函数 ---------------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.prototype.slice.call(r.querySelectorAll(s));
const pad = n => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
/** HTML 转义，防止用户输入破坏页面结构 */
const esc = s => String(s === undefined || s === null ? '' : s)
  .replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* 日期工具 */
const ymd    = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today  = () => ymd(new Date());
const parseYmd = s => { const a = String(s).split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000); // b - a 的天数
const monthKey = s => String(s).slice(0, 7);
const weekdayCN = ['日', '一', '二', '三', '四', '五', '六'];
/** 某个日期所在周的周一 */
function mondayOf(dateStr){
  const d = parseYmd(dateStr), w = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - w);
  return ymd(d);
}
/** 数字格式化，去掉多余小数 */
const num = v => { const n = Number(v) || 0; return Number.isInteger(n) ? String(n) : n.toFixed(1); };
const money = v => (Number(v) || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/* ---------------- 2. 数据层：localStorage ---------------- */
const STORE_KEY = 'xxdiary_v1';

/** 默认数据结构 */
function defaultData(){
  return {
    theme: 'light',
    todos: [],            // {id,text,date,done,createdAt}
    events: [],           // {id,title,date,type:'holiday'|'anniversary',note,remind}
    trainings: [],        // {id,type,date,duration,score,self,note}
    trainTarget: { week: 3, month: 12 },   // 体能目标：每周/每月训练次数
    trips: [],            // {id,dest,start,end,budget,days:[{d,plan}],pack:[{text,done}],notes:[{d,text}]}
    movies: [],           // {id,title,date,rating,review,status:'seen'|'want'}
    ledger: [],           // {id,kind:'public'|'private',purpose,category,amount,date,note}
    moods: [],            // {date,mood,text}
    goals: [],            // {id,title,deadline,sub:[{text,done}],archived}
    vault: []             // {id,name,account,password,note}
  };
}
let DB = (function load(){
  try{
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    const d = defaultData();
    // 合并：保证新版本新增字段不会缺失
    Object.keys(d).forEach(k => { if(raw[k] === undefined) raw[k] = d[k]; });
    return raw;
  }catch(e){ return defaultData(); }
})();
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
  catch(e){ toast('保存失败：浏览器存储空间不足或被禁用'); }
}

/* ---------------- 3. 运行时状态 ---------------- */
const state = {
  page: 'home',
  vaultShow: {},                    // 密码模块中已点击「眼睛」显示的记录
  vaultQ: '',
  trainType: '长跑',                // 体能模块当前展示的运动类型
  ledgerKind: 'private',            // 账本表单当前类型
  ledgerMonth: '',                  // 账本统计月份
  todoDate: '',                     // 待办所选日期
  calMonth: '', calSel: '',         // 日历所显示月份 / 选中日期
  tripId: null,                     // 正在查看的旅行计划
  movieQ: '', movieFilter: 'all',   // 观影搜索与筛选
  moodMonth: '', moodSel: '',       // 心情日历
  goalTab: 'active'                 // 目标清单：active / archived
};

/* ---------------- 4. Canvas 图表工具 ---------------- */
const chartReg = [];   // 当前页面所有图表重绘函数（每次切换页面时清空，防止内存泄漏）
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

/** 初始化 canvas 尺寸，处理高分屏模糊问题 */
function prepCanvas(cv, h){
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(240, cv.clientWidth || (cv.parentElement ? cv.parentElement.clientWidth : 300) - 28 || 300);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.height = h + 'px'; cv.style.width = '100%';
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx, w, h };
}
/** 注册图表：立即绘制，并在窗口尺寸变化时重绘 */
function chart(cv, h, draw){
  const run = () => { if(!cv.isConnected) return; const c = prepCanvas(cv, h); draw(c.ctx, c.w, c.h); };
  run();
  chartReg.push(run);
}
window.addEventListener('resize', () => {
  clearTimeout(window.__rz);
  window.__rz = setTimeout(() => chartReg.forEach(f => f()), 160);
});

/** 折线/趋势图绘制（含网格、坐标轴、可选目标参考线） */
function drawLine(ctx, w, h, points, opt){
  opt = opt || {};
  const padL = 38, padR = 12, padT = 14, padB = 26;
  const cw = w - padL - padR, ch = h - padT - padB;
  const grid = cssVar('--line'), sub = cssVar('--sub'), acc = opt.color || cssVar('--accent');
  const vals = points.map(p => p.y);
  if(opt.target !== undefined && opt.target !== null) vals.push(Number(opt.target));
  let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if(min === max){ min -= 1; max += 1; }
  const span = max - min; min -= span * 0.15; max += span * 0.15;

  const X = i => padL + (points.length === 1 ? cw / 2 : cw * i / (points.length - 1));
  const Y = v => padT + ch * (1 - (v - min) / (max - min));

  // 横向网格 + Y 轴刻度
  ctx.font = '10px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for(let i = 0; i <= 4; i++){
    const y = padT + ch * i / 4;
    ctx.strokeStyle = grid; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillStyle = sub;
    ctx.fillText(num(max - (max - min) * i / 4), padL - 6, y);
  }
  // 目标参考线（虚线）
  if(opt.target !== undefined && opt.target !== null){
    const ty = Y(Number(opt.target));
    ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = cssVar('--danger'); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(padL, ty); ctx.lineTo(w - padR, ty); ctx.stroke(); ctx.restore();
    ctx.fillStyle = cssVar('--danger'); ctx.textAlign = 'left';
    ctx.fillText('目标 ' + num(opt.target), padL + 4, ty - 8);
  }
  if(!points.length){
    ctx.fillStyle = sub; ctx.textAlign = 'center'; ctx.font = '13px sans-serif';
    ctx.fillText('暂无数据', w / 2, h / 2); return;
  }
  // 折线与渐变填充
  ctx.beginPath();
  points.forEach((p, i) => i ? ctx.lineTo(X(i), Y(p.y)) : ctx.moveTo(X(i), Y(p.y)));
  ctx.strokeStyle = acc; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke();
  const g = ctx.createLinearGradient(0, padT, 0, padT + ch);
  g.addColorStop(0, 'rgba(102,199,155,.32)'); g.addColorStop(1, 'rgba(102,199,155,0)');
  ctx.lineTo(X(points.length - 1), padT + ch); ctx.lineTo(X(0), padT + ch); ctx.closePath();
  ctx.fillStyle = g; ctx.fill();
  // 数据点
  points.forEach((p, i) => {
    ctx.beginPath(); ctx.arc(X(i), Y(p.y), 3.2, 0, Math.PI * 2);
    ctx.fillStyle = cssVar('--card'); ctx.fill();
    ctx.strokeStyle = acc; ctx.lineWidth = 2; ctx.stroke();
  });
  // X 轴标签（最多显示 6 个，避免拥挤）
  ctx.fillStyle = sub; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.font = '10px sans-serif';
  const step = Math.ceil(points.length / 6);
  points.forEach((p, i) => { if(i % step === 0 || i === points.length - 1) ctx.fillText(p.x, X(i), padT + ch + 7); });
}

/** 饼图绘制 */
function drawPie(ctx, w, h, data){
  const total = data.reduce((s, d) => s + (Number(d.value) || 0), 0);
  if(total <= 0){
    ctx.fillStyle = cssVar('--sub'); ctx.font = '13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('暂无数据', w / 2, h / 2); return;
  }
  const cx = Math.min(w * 0.32, h / 2 + 14), cy = h / 2, r = Math.min(h / 2 - 12, cx - 6);
  let a0 = -Math.PI / 2;
  data.forEach(d => {
    const a1 = a0 + Math.PI * 2 * (Number(d.value) || 0) / total;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, a0, a1); ctx.closePath();
    ctx.fillStyle = d.color; ctx.fill();
    ctx.strokeStyle = cssVar('--card'); ctx.lineWidth = 2; ctx.stroke();
    a0 = a1;
  });
  // 中心留白，形成环形
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.52, 0, Math.PI * 2);
  ctx.fillStyle = cssVar('--card'); ctx.fill();
  ctx.fillStyle = cssVar('--text'); ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('流出', cx, cy);
  // 图例
  const lx = cx + r + 16, ly0 = cy - data.length * 13;
  ctx.textAlign = 'left'; ctx.font = '12px sans-serif';
  data.forEach((d, i) => {
    const ly = ly0 + i * 26;
    ctx.fillStyle = d.color; ctx.beginPath();
    ctx.arc(lx + 5, ly + 3, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = cssVar('--text');
    ctx.fillText(d.label, lx + 16, ly + 3);
    ctx.fillStyle = cssVar('--sub'); ctx.font = '11px sans-serif';
    const pct = ((Number(d.value) || 0) / total * 100).toFixed(1);
    ctx.fillText('¥' + money(d.value) + '  ' + pct + '%', lx + 16, ly + 17);
    ctx.font = '12px sans-serif';
  });
}

let toastTimer = null;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}
function openModal(html){ $('#modal').innerHTML = html; $('#modalMask').classList.add('show'); }
function closeModal(){ $('#modalMask').classList.remove('show'); $('#modal').innerHTML = ''; }

/** 确认弹窗，返回 Promise<boolean> */
function confirmBox(msg, okText){
  return new Promise(res => {
    openModal(`<h3 class="modal-title">请确认</h3><p class="pre">${esc(msg)}</p>
      <div class="modal-actions"><button class="btn ghost" data-no>取消</button>
      <button class="btn danger" data-yes>${esc(okText || '确定')}</button></div>`);
    $('[data-no]', $('#modal')).onclick = () => { closeModal(); res(false); };
    $('[data-yes]', $('#modal')).onclick = () => { closeModal(); res(true); };
  });
}

/**
 * 通用表单弹窗
 * @param {string} title 标题
 * @param {Array}  fields [{key,label,type,value,options,ph,required,step}]
 * @param {Function} onSave 回调，参数为 {key:value}
 */
function openForm(title, fields, onSave, saveText){
  const rows = fields.map(f => {
    let ctl;
    if(f.type === 'textarea'){
      ctl = `<textarea name="${f.key}" placeholder="${esc(f.ph || '')}">${esc(f.value || '')}</textarea>`;
    }else if(f.type === 'select'){
      ctl = `<select name="${f.key}">${f.options.map(o =>
        `<option value="${esc(o.v)}"${String(o.v) === String(f.value === undefined ? '' : f.value) ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
    }else{
      ctl = `<input name="${f.key}" type="${f.type || 'text'}" value="${esc(f.value === undefined || f.value === null ? '' : f.value)}"
             placeholder="${esc(f.ph || '')}"${f.step ? ` step="${f.step}"` : ''}>`;
    }
    return `<label class="fl"><span>${esc(f.label)}${f.required ? ' <span style="color:var(--danger)">*</span>' : ''}</span>${ctl}</label>`;
  }).join('');
  openModal(`<h3 class="modal-title">${esc(title)}</h3><form class="mform" id="mForm">${rows}
    <div class="modal-actions"><button type="button" class="btn ghost" data-no>取消</button>
    <button type="submit" class="btn">${esc(saveText || '保存')}</button></div></form>`);
  $('[data-no]', $('#modal')).onclick = closeModal;
  $('#mForm').addEventListener('submit', e => {
    e.preventDefault();
    const data = {};
    fields.forEach(f => { data[f.key] = ($(`[name="${f.key}"]`, $('#modal')).value || '').trim(); });
    const miss = fields.find(f => f.required && !data[f.key]);
    if(miss){ toast('请填写：' + miss.label); return; }
    closeModal(); onSave(data);
  });
}

/** 复制文本到剪贴板（file:// 下 Clipboard API 可能不可用，提供兜底方案） */
function copyText(text, label){
  const done = () => toast((label || '内容') + '已复制');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  }else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
  ta.setAttribute('readonly', 'readonly');
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ ta.setSelectionRange(0, text.length); }catch(e){}
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
  document.body.removeChild(ta);
  if(ok) done(); else toast('当前环境不支持自动复制，请长按内容手动复制');
}

/* ===== 模块1：今日待办 ===== */
function renderTodo(root){
  if(!state.todoDate) state.todoDate = today();
  const d = state.todoDate;
  const isToday = d === today();
  const list = DB.todos.filter(t => t.date === d)
    .sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0) || (a.createdAt || 0) - (b.createdAt || 0));
  const doneN = list.filter(t => t.done).length;
  const rate = list.length ? Math.round(doneN / list.length * 100) : 0;
  const wk = weekdayCN[parseYmd(d).getDay()];

  root.innerHTML = `
  <div class="page-head"><h2>今日待办</h2><span class="hint">与日历模块互通</span></div>

  <div class="card">
    <h3>📅 选择日期 <span class="tag${isToday ? '' : ' gray'}">${isToday ? '今天' : esc(d) + ' 星期' + wk}</span></h3>
    <div class="row">
      <button class="btn small ghost" data-act="prevDay">‹ 前一天</button>
      <input type="date" id="todoDate" value="${d}">
      <button class="btn small ghost" data-act="nextDay">后一天 ›</button>
    </div>
    ${isToday ? '' : '<button class="btn small ghost block mt" data-act="toToday">回到今天</button>'}
    <div class="kcal mt">
      <div class="kpi"><b>${list.length}</b><span>任务总数</span></div>
      <div class="kpi"><b>${doneN}</b><span>已完成</span></div>
      <div class="kpi"><b>${rate}%</b><span>完成率</span></div>
    </div>
    <div class="prog mt"><i style="width:${rate}%"></i></div>
  </div>

  <div class="card">
    <h3>➕ 新增任务</h3>
    <input id="todoInput" placeholder="例如：完成周报、慢跑 5 公里" maxlength="60">
    <button class="btn block mt" data-act="add">添加到 ${isToday ? '今天' : esc(d)}</button>
  </div>

  <div class="card">
    <h3>📋 任务清单 <span class="tag">${doneN} / ${list.length}</span></h3>
    <div class="list">
      ${list.length ? list.map(t => `
        <div class="item">
          <div class="check ${t.done ? 'on' : ''}" data-act="toggle" data-id="${t.id}">
            <span class="box">✓</span><span class="lb">${esc(t.text)}</span>
          </div>
          <div class="item-actions">
            <button class="mini" data-act="edit" data-id="${t.id}" aria-label="编辑">✏️</button>
            <button class="mini" data-act="del" data-id="${t.id}" aria-label="删除">🗑️</button>
          </div>
        </div>`).join('')
      : `<div class="empty"><span class="big">📝</span>这一天还没有任务<br>在上方输入框添加第一条吧</div>`}
    </div>
    ${list.length && doneN === list.length ? '<p class="sub center mt">🎉 全部完成，今天很棒！</p>' : ''}
  </div>`;

  // ---- 事件绑定 ----
  const dateInput = $('#todoDate', root);
  dateInput.onchange = () => { state.todoDate = dateInput.value || today(); renderTodo(root); };
  $('#todoInput', root).addEventListener('keydown', e => { if(e.key === 'Enter') addTodo(root); });

  root.onclick = e => {
    const el = e.target.closest('[data-act]');
    if(!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    const item = DB.todos.find(t => t.id === id);
    if(act === 'prevDay' || act === 'nextDay'){
      const dt = parseYmd(state.todoDate); dt.setDate(dt.getDate() + (act === 'prevDay' ? -1 : 1));
      state.todoDate = ymd(dt); renderTodo(root);
    }
    else if(act === 'toToday'){ state.todoDate = today(); renderTodo(root); }
    else if(act === 'add'){ addTodo(root); }
    else if(act === 'toggle' && item){ item.done = !item.done; save(); renderTodo(root); }
    else if(act === 'edit' && item){
      openForm('编辑任务', [
        { key: 'text', label: '任务内容', value: item.text, required: true },
        { key: 'date', label: '绑定日期', type: 'date', value: item.date, required: true }
      ], data => {
        item.text = data.text; item.date = data.date; save();
        state.todoDate = data.date; toast('已保存'); renderTodo(root);
      });
    }
    else if(act === 'del' && item){
      confirmBox('确定删除任务「' + item.text + '」吗？').then(ok => {
        if(!ok) return;
        DB.todos = DB.todos.filter(t => t.id !== id); save(); toast('已删除'); renderTodo(root);
      });
    }
  };
}
function addTodo(root){
  const inp = $('#todoInput', root);
  const text = (inp.value || '').trim();
  if(!text){ toast('请输入任务内容'); inp.focus(); return; }
  DB.todos.push({ id: uid(), text: text, date: state.todoDate, done: false, createdAt: Date.now() });
  save(); toast('已添加任务'); renderTodo(root);
}
/* ===== 模块2：日历倒计时（节日提醒） ===== */
function renderCalendar(root){
  if(!state.calMonth) state.calMonth = monthKey(today());
  if(!state.calSel) state.calSel = today();
  const year = Number(state.calMonth.slice(0, 4));
  const month = Number(state.calMonth.slice(5, 7)) - 1;   // 0-11
  const t = today();

  // 事件 / 待办 按日期归类，用于日历打点
  const evMap = {}, tdMap = {};
  DB.events.forEach(e => { evMap[e.date] = (evMap[e.date] || 0) + 1; });
  DB.todos.forEach(x => { tdMap[x.date] = (tdMap[x.date] || 0) + 1; });

  // 生成月历格子（周一为每周首列）
  const startW = (new Date(year, month, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const total = Math.ceil((startW + daysInMonth) / 7) * 7;
  let cells = '';
  for(let i = 0; i < total; i++){
    const dayNum = i - startW + 1;
    const dt = new Date(year, month, dayNum);
    const ds = ymd(dt);
    const other = dayNum < 1 || dayNum > daysInMonth;
    const isToday = ds === t, isSel = ds === state.calSel;
    const hasEv = !!evMap[ds], hasTd = !!tdMap[ds];
    cells += `<div class="cal-cell${other ? ' other' : ''}${isToday ? ' today' : ''}${isSel && !isToday ? ' sel' : ''}" data-act="sel" data-date="${ds}">
      <span>${dt.getDate()}</span>
      ${hasEv ? '<i class="dot"></i>' : ''}
      ${hasTd ? `<i class="dot todo${hasEv ? '' : ' solo'}"></i>` : ''}
    </div>`;
  }

  // 临近事件（今天及以后，按剩余天数升序）
  const upcoming = DB.events
    .map(e => ({ e: e, left: daysBetween(t, e.date) }))
    .filter(x => x.left >= 0).sort((a, b) => a.left - b.left).slice(0, 6);
  // 到达提醒窗口的事件
  const alerting = DB.events.filter(e => { const l = daysBetween(t, e.date); return l >= 0 && l <= Number(e.remind || 0); });

  // 选中日期的事件与待办
  const dayEvents = DB.events.filter(e => e.date === state.calSel).sort((a, b) => a.date.localeCompare(b.date));
  const dayTodos = DB.todos.filter(x => x.date === state.calSel);

  root.innerHTML = `
  <div class="page-head"><h2>日历倒计时</h2><span class="hint">${year}年${month + 1}月</span></div>

  ${alerting.length ? `<div class="card" style="border-color:var(--danger)">
    <h3>🔔 待办提醒</h3>
    ${alerting.map(e => {
      const l = daysBetween(t, e.date);
      return `<p class="mt">${l === 0 ? '🔴 今天就是' : '🟠 还有 ' + l + ' 天：'}《${esc(e.title)}》${e.note ? ' · ' + esc(e.note) : ''}</p>`;
    }).join('')}
  </div>` : ''}

  <div class="card">
    <h3>⏳ 倒计时
      <span class="tag">${upcoming.length ? '最近 ' + Math.min(6, upcoming.length) + ' 条' : '暂无'}</span></h3>
    <div class="list">
      ${upcoming.length ? upcoming.map(x => `
        <div class="item">
          <div class="item-main">
            <div class="t">${esc(x.e.title)}</div>
            <div class="m"><span>${esc(x.e.date)}</span>${x.e.note ? '<span>' + esc(x.e.note) + '</span>' : ''}
              <span class="tag gray">${esc(x.e.type || '事件')}</span></div>
          </div>
          <div class="item-actions"><span class="tag${x.left <= 3 ? ' danger' : ''}">${x.left === 0 ? '今天' : '剩 ' + x.left + ' 天'}</span></div>
        </div>`).join('')
      : '<div class="empty"><span class="big">⏳</span>还没有未来的事件<br>点击下方按钮添加节日或纪念日</div>'}
    </div>
  </div>

  <div class="card">
    <div class="cal-head">
      <button class="mini" data-act="prevM">‹</button>
      <div class="ym">${year} 年 ${month + 1} 月</div>
      <button class="mini" data-act="nextM">›</button>
    </div>
    <div class="cal-grid">
      ${weekdayCN.map(w => `<div class="cal-wk">${w}</div>`).join('')}
    </div>
    <div class="cal-grid mt">
      ${cells}
    </div>
    <div class="row mt">
      <button class="btn small ghost block" data-act="backToday">回到今天</button>
    </div>
    <p class="sub mt">🔴 红点=节日/纪念日　🔵 蓝点=当天有任务</p>
  </div>

  <div class="card">
    <h3>📌 ${esc(state.calSel)} 的日程
      <span class="tag">${dayEvents.length} 事件 / ${dayTodos.length} 任务</span></h3>
    <div class="list">
      ${dayEvents.length ? dayEvents.map(e => `
        <div class="item">
          <div class="item-main">
            <div class="t">${esc(e.title)}</div>
            <div class="m"><span class="tag gray">${esc(e.type || '事件')}</span>
              <span>${daysBetween(t, e.date) >= 0 ? '剩余 ' + daysBetween(t, e.date) + ' 天' : '已过 ' + Math.abs(daysBetween(t, e.date)) + ' 天'}</span>
              <span>提前 ${Number(e.remind || 0)} 天提醒</span></div>
            ${e.note ? `<div class="m pre">📝 ${esc(e.note)}</div>` : ''}
          </div>
          <div class="item-actions">
            <button class="mini" data-act="editEv" data-id="${e.id}" aria-label="编辑">✏️</button>
            <button class="mini" data-act="delEv" data-id="${e.id}" aria-label="删除">🗑️</button>
          </div>
        </div>`).join('') : ''}
      ${dayTodos.map(x => `
        <div class="item">
          <div class="item-main">
            <div class="t${x.done ? ' done' : ''}">${x.done ? '☑' : '☐'} ${esc(x.text)}</div>
            <div class="m"><span class="tag gray">待办任务</span></div>
          </div>
        </div>`).join('')}
      ${!dayEvents.length && !dayTodos.length ? '<div class="empty"><span class="big">🗓️</span>这一天暂无安排</div>' : ''}
    </div>
    <div class="row mt">
      <button class="btn small" data-act="addEv">＋ 新增事件</button>
      <button class="btn small ghost" data-act="toTodo">去待办添加任务</button>
    </div>
  </div>`;

  // ---- 事件绑定 ----
  const evForm = (item) => openForm(item ? '编辑事件' : '新增事件', [
    { key: 'title', label: '事件名称', value: item ? item.title : '', ph: '如：中秋节 / 结婚纪念日', required: true },
    { key: 'date', label: '日期', type: 'date', value: item ? item.date : state.calSel, required: true },
    { key: 'type', label: '类型', type: 'select', value: item ? item.type : '节日',
      options: [{ v: '节日', label: '节日' }, { v: '纪念日', label: '纪念日' }, { v: '生日', label: '生日' }, { v: '其他', label: '其他' }] },
    { key: 'remind', label: '提前提醒天数', type: 'number', value: item ? item.remind : 3, ph: '0 表示当天提醒' },
    { key: 'note', label: '备注', type: 'textarea', value: item ? item.note : '', ph: '补充说明，可为空' }
  ], data => {
    if(item){ Object.assign(item, data, { remind: Number(data.remind) || 0 }); }
    else { DB.events.push(Object.assign({ id: uid() }, data, { remind: Number(data.remind) || 0 })); }
    save(); toast(item ? '已保存' : '已添加事件'); renderCalendar(root);
  });

  root.onclick = e => {
    const el = e.target.closest('[data-act]'); if(!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    const item = DB.events.find(x => x.id === id);
    if(act === 'prevM' || act === 'nextM'){
      const dt = new Date(year, month + (act === 'prevM' ? -1 : 1), 1);
      state.calMonth = ymd(dt).slice(0, 7); renderCalendar(root);
    }
    else if(act === 'backToday'){ state.calMonth = monthKey(today()); state.calSel = today(); renderCalendar(root); }
    else if(act === 'sel'){ state.calSel = el.dataset.date; renderCalendar(root); }
    else if(act === 'addEv'){ evForm(null); }
    else if(act === 'editEv' && item){ evForm(item); }
    else if(act === 'delEv' && item){
      confirmBox('确定删除事件「' + item.title + '」吗？').then(ok => {
        if(!ok) return;
        DB.events = DB.events.filter(x => x.id !== id); save(); toast('已删除'); renderCalendar(root);
      });
    }
    else if(act === 'toTodo'){ state.todoDate = state.calSel; go('todo'); }
  };
}
/* ===== 模块3：体能训练情况 ===== */
const TRAIN_TYPES = [
  { name: '长跑',     unit: '分钟', step: '0.1' },
  { name: '力量',     unit: 'kg',   step: '0.5' },
  { name: '俯卧撑',   unit: '个',   step: '1' },
  { name: '仰卧起坐', unit: '个',   step: '1' },
  { name: '引体向上', unit: '个',   step: '1' },
  { name: '其他',     unit: '分',   step: '0.1' }
];
function trainUnit(typeName){ const x = TRAIN_TYPES.find(v => v.name === typeName); return x ? x.unit : '分'; }

function renderFitness(root){
  const t = today();
  const type = state.trainType;
  const unit = trainUnit(type);
  const wkStart = mondayOf(t);
  const weekCnt = DB.trainings.filter(x => x.date >= wkStart && x.date <= t).length;
  const monthCnt = DB.trainings.filter(x => monthKey(x.date) === monthKey(t)).length;
  const gWeek = Number(DB.trainTarget.week) || 0, gMonth = Number(DB.trainTarget.month) || 0;
  const wp = gWeek ? Math.min(100, Math.round(weekCnt / gWeek * 100)) : 0;
  const mp = gMonth ? Math.min(100, Math.round(monthCnt / gMonth * 100)) : 0;

  // 当前项目的成绩序列（用于趋势图与进步对比）
  const series = DB.trainings.filter(x => x.type === type && x.score !== '' && x.score !== undefined && x.score !== null)
    .sort((a, b) => a.date.localeCompare(b.date));
  const pts = series.slice(-20).map(x => ({ x: x.date.slice(5), y: Number(x.score) || 0 }));
  const last = series[series.length - 1], prev = series[series.length - 2];
  const diff = last && prev ? Number(last.score) - Number(prev.score) : null;

  const list = DB.trainings.slice().sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));

  root.innerHTML = `
  <div class="page-head"><h2>体能训练</h2><span class="hint">共 ${DB.trainings.length} 次记录</span></div>

  <div class="card">
    <h3>🎯 体能目标 <span class="tag gray">每周 ${gWeek} 次 / 每月 ${gMonth} 次</span></h3>
    <div class="grid2">
      <div class="kpi"><b>${weekCnt}</b><span>本周已练（次）</span></div>
      <div class="kpi"><b>${monthCnt}</b><span>本月已练（次）</span></div>
    </div>
    <p class="sub mt">本周进度 ${weekCnt}/${gWeek}</p>
    <div class="prog"><i style="width:${wp}%"></i></div>
    <p class="sub mt">本月进度 ${monthCnt}/${gMonth}</p>
    <div class="prog"><i style="width:${mp}%"></i></div>
    <button class="btn small ghost block mt" data-act="editTarget">修改目标</button>
  </div>

  <div class="card">
    <h3>📈 ${esc(type)}成绩趋势
      <span class="tag${diff === null ? ' gray' : diff >= 0 ? '' : ' warn'}">
        ${diff === null ? '暂无对比' : (diff >= 0 ? '↑ 进步 ' : '↓ 减少 ') + num(Math.abs(diff)) + unit}</span></h3>
    <div class="chips mt">
      ${TRAIN_TYPES.map(v => `<div class="chip${v.name === type ? ' on' : ''}" data-act="pickType" data-type="${v.name}">${v.name}</div>`).join('')}
    </div>
    <canvas id="trainChart"></canvas>
    <p class="sub center mt">${pts.length < 2 ? '至少录入 2 条该项目的成绩才能形成趋势' : '单位：' + unit + '（最近 ' + pts.length + ' 次）'}</p>
  </div>

  <div class="card">
    <h3>➕ 新增训练记录</h3>
    <button class="btn block" data-act="addTrain">记录一次训练</button>
    <p class="sub mt">记录训练项目、日期、时长、成绩与自评，历史记录自动保存。</p>
  </div>

  <div class="card">
    <h3>🗂️ 历史训练记录 <span class="tag">${list.length} 条</span></h3>
    <div class="list list-scroll">
      ${list.length ? list.map(x => `
        <div class="item">
          <div class="item-main">
            <div class="t">${esc(x.type)}${x.score !== '' && x.score !== undefined ? ' · ' + num(x.score) + trainUnit(x.type) : ''}</div>
            <div class="m"><span>${esc(x.date)}</span><span>时长 ${num(x.duration)} 分钟</span>
              <span>自评 ${'★'.repeat(Number(x.self) || 0)}${'☆'.repeat(5 - (Number(x.self) || 0))}</span></div>
            ${x.note ? `<div class="m pre">${esc(x.note)}</div>` : ''}
          </div>
          <div class="item-actions">
            <button class="mini" data-act="editTrain" data-id="${x.id}" aria-label="编辑">✏️</button>
            <button class="mini" data-act="delTrain" data-id="${x.id}" aria-label="删除">🗑️</button>
          </div>
        </div>`).join('')
      : '<div class="empty"><span class="big">🏃</span>还没有训练记录<br>点击上方按钮记录第一次训练吧</div>'}
    </div>
  </div>`;

  // Canvas 趋势图
  const cv = $('#trainChart', root);
  if(cv) chart(cv, 200, (ctx, w, h) => drawLine(ctx, w, h, pts, { color: cssVar('--p1') }));

  const form = (item) => openForm(item ? '编辑训练记录' : '新增训练记录', [
    { key: 'type', label: '训练项目', type: 'select', value: item ? item.type : type,
      options: TRAIN_TYPES.map(v => ({ v: v.name, label: v.name })) },
    { key: 'date', label: '训练日期', type: 'date', value: item ? item.date : t, required: true },
    { key: 'duration', label: '训练时长（分钟）', type: 'number', value: item ? item.duration : 30, step: '1', required: true },
    { key: 'score', label: '成绩（留空表示不计成绩）', type: 'number', value: item ? item.score : '', ph: '如长跑 25 分钟' },
    { key: 'self', label: '自评（1-5 星）', type: 'select', value: item ? item.self : 4,
      options: [1, 2, 3, 4, 5].map(n => ({ v: n, label: '★'.repeat(n) + '（' + n + ' 星）' })) },
    { key: 'note', label: '备注', type: 'textarea', value: item ? item.note : '', ph: '今天的状态、突破等' }
  ], data => {
    const payload = { type: data.type, date: data.date, duration: Number(data.duration) || 0, score: data.score, self: Number(data.self) || 0, note: data.note };
    if(item) Object.assign(item, payload);
    else DB.trainings.push(Object.assign({ id: uid(), createdAt: Date.now() }, payload));
    state.trainType = payload.type;
    save(); toast(item ? '已保存' : '已记录本次训练'); renderFitness(root);
  });

  root.onclick = e => {
    const el = e.target.closest('[data-act]'); if(!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    const item = DB.trainings.find(x => x.id === id);
    if(act === 'pickType'){ state.trainType = el.dataset.type; renderFitness(root); }
    else if(act === 'addTrain'){ form(null); }
    else if(act === 'editTrain' && item){ form(item); }
    else if(act === 'delTrain' && item){
      confirmBox('确定删除 ' + item.date + ' 的「' + item.type + '」记录吗？').then(ok => {
        if(!ok) return;
        DB.trainings = DB.trainings.filter(x => x.id !== id); save(); toast('已删除'); renderFitness(root);
      });
    }
    else if(act === 'editTarget'){
      openForm('设置体能目标', [
        { key: 'week', label: '每周训练次数目标', type: 'number', value: gWeek, step: '1', required: true },
        { key: 'month', label: '每月训练次数目标', type: 'number', value: gMonth, step: '1', required: true }
      ], data => {
        DB.trainTarget = { week: Number(data.week) || 0, month: Number(data.month) || 0 };
        save(); toast('目标已更新'); renderFitness(root);
      });
    }
  };
}
/* ===== 模块4：旅游规划 ===== */
function renderTrip(root){
  const trip = state.tripId ? DB.trips.find(x => x.id === state.tripId) : null;
  if(state.tripId && !trip) state.tripId = null;
  if(trip) return renderTripDetail(root, trip);

  const list = DB.trips.slice().sort((a, b) => String(b.start || '').localeCompare(String(a.start || '')));
  root.innerHTML = `
  <div class="page-head"><h2>旅游规划</h2><span class="hint">${list.length} 个方案</span></div>

  <div class="card">
    <h3>➕ 新建旅行计划</h3>
    <button class="btn block" data-act="addTrip">新建一条旅行方案</button>
    <p class="sub mt">填写目的地、出行时间、预算，再按天规划行程与物品清单。</p>
  </div>

  ${list.length ? list.map(p => {
    const dayN = p.start && p.end ? Math.max(1, daysBetween(p.start, p.end) + 1) : 0;
    const packDone = (p.pack || []).filter(x => x.done).length;
    const noteN = (p.notes || []).length;
    return `<div class="card">
      <h3>🏝️ ${esc(p.dest || '未命名目的地')}
        <span class="tag">${dayN ? dayN + ' 天' : '未定日期'}</span></h3>
      <div class="item-main">
        <div class="m"><span>🗓️ ${esc(p.start || '?')} ~ ${esc(p.end || '?')}</span>
          <span>💰 预算 ¥${money(p.budget)}</span>
          <span>🎒 打包 ${packDone}/${(p.pack || []).length}</span>
          <span>📒 笔记 ${noteN} 条</span></div>
      </div>
      <div class="row mt">
        <button class="btn small" data-act="openTrip" data-id="${p.id}">查看 / 规划</button>
        <button class="btn small ghost" data-act="editTrip" data-id="${p.id}">编辑</button>
        <button class="btn small ghost" data-act="delTrip" data-id="${p.id}">删除</button>
      </div>
    </div>`;
  }).join('') : '<div class="empty"><span class="big">✈️</span>还没有旅行计划<br>点击上方按钮规划下一趟旅程</div>'}`;

  const form = (item) => openForm(item ? '编辑旅行计划' : '新建旅行计划', [
    { key: 'dest', label: '目的地', value: item ? item.dest : '', ph: '如：云南大理', required: true },
    { key: 'start', label: '出发日期', type: 'date', value: item ? item.start : today(), required: true },
    { key: 'end', label: '返回日期', type: 'date', value: item ? item.end : today(), required: true },
    { key: 'budget', label: '预算（元）', type: 'number', value: item ? item.budget : 3000, step: '1' }
  ], data => {
    if(item){ Object.assign(item, data, { budget: Number(data.budget) || 0 }); }
    else {
      const p = { id: uid(), dest: data.dest, start: data.start, end: data.end, budget: Number(data.budget) || 0, days: {}, pack: [], notes: [] };
      DB.trips.push(p); state.tripId = p.id;
    }
    save(); toast(item ? '已保存' : '已创建旅行计划'); renderTrip(root);
  });

  root.onclick = e => {
    const el = e.target.closest('[data-act]'); if(!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    const item = DB.trips.find(x => x.id === id);
    if(act === 'addTrip') form(null);
    else if(act === 'openTrip'){ state.tripId = id; renderTrip(root); }
    else if(act === 'editTrip' && item) form(item);
    else if(act === 'delTrip' && item){
      confirmBox('确定删除「' + (item.dest || '未命名') + '」的旅行计划吗？').then(ok => {
        if(!ok) return;
        DB.trips = DB.trips.filter(x => x.id !== id); save(); toast('已删除'); renderTrip(root);
      });
    }
  };
}

/** 旅行计划详情：行程按天规划 + 物品清单 + 旅行笔记 */

  for(let i = 0; i < Math.min(dayN, 90); i++){
    const d = parseYmd(p.start); d.setDate(d.getDate() + i);
    dayList.push(ymd(d));
  }
  const packDone = (p.pack || []).filter(x => x.done).length;
  const packPct = (p.pack || []).length ? Math.round(packDone / p.pack.length * 100) : 0;

  root.innerHTML = `
  <div class="page-head">
    <h2>✈️ ${esc(p.dest || '旅行计划')}</h2>
    <button class="btn small ghost" data-act="back">← 返回列表</button>
  </div>

  <div class="card">
    <h3>ℹ️ 基本信息</h3>
    <div class="kcal">
      <div class="kpi"><b>${dayN || '-'}</b><span>行程天数</span></div>
      <div class="kpi"><b>¥${money(p.budget)}</b><span>预算</span></div>
      <div class="kpi"><b>${packDone}/${(p.pack || []).length}</b><span>已打包</span></div>

  </div>

  <div class="card">
    <h3>🗺️ 行程安排（按天）</h3>
    <div class="list list-scroll">
      ${dayList.length ? dayList.map(d => `
        <div class="item" style="display:block">
          <div class="m" style="margin-bottom:6px"><span class="tag gray">第 ${daysBetween(p.start, d) + 1} 天</span>
            <span>${esc(d)} 星期${weekdayCN[parseYmd(d).getDay()]}</span></div>
          <textarea data-day="${d}" placeholder="这一天的安排，如：上午骑行洱海，下午逛古城">${esc((p.days || {})[d] || '')}</textarea>
        </div>`).join('') : '<div class="empty"><span class="big">🗺️</span>请先编辑填写出行时间</div>'}
    </div>
    ${dayList.length ? '<button class="btn block mt" data-act="saveDays">保存行程安排</button>' : ''}
  </div>

  <div class="card">
    <h3>🎒 物品清单 <span class="tag">${packDone}/${(p.pack || []).length}</span></h3>
    <div class="prog"><i style="width:${packPct}%"></i></div>
    <div class="row mt">
      <input id="packInput" placeholder="如：充电宝、身份证、防晒霜" maxlength="30">
      <button class="btn small" data-act="addPack" style="flex:0 0 auto">添加</button>
    </div>
    <div class="list">
      ${(p.pack || []).length ? p.pack.map((x, i) => `
        <div class="item">
          <div class="check ${x.done ? 'on' : ''}" data-act="togglePack" data-i="${i}">
            <span class="box">✓</span><span class="lb">${esc(x.text)}</span>
          </div>
          <div class="item-actions"><button class="mini" data-act="delPack" data-i="${i}" aria-label="删除">🗑️</button></div>
        </div>`).join('') : '<div class="empty"><span class="big">🎒</span>物品清单还是空的</div>'}
    </div>
  </div>

  <div class="card">
    <h3>📒 旅行笔记 <span class="tag">${(p.notes || []).length} 条</span></h3>
    <button class="btn small block" data-act="addNote">＋ 写一条旅行笔记</button>
    <div class="list">
      ${(p.notes || []).slice().sort((a, b) => String(b.date).localeCompare(String(a.date))).map(n => `
        <div class="item">
          <div class="item-main">
            <div class="m"><span>${esc(n.date)}</span></div>
            <div class="pre">${esc(n.text)}</div>
          </div>
          <div class="item-actions">
            <button class="mini" data-act="editNote" data-id="${n.id}" aria-label="编辑">✏️</button>
            <button class="mini" data-act="delNote" data-id="${n.id}" aria-label="删除">🗑️</button>
          </div>
        </div>`).join('') || '<div class="empty"><span class="big">📒</span>还没有旅行笔记</div>'}
    </div>
  </div>`;

  $('#packInput', root).addEventListener('keydown', e => { if(e.key === 'Enter') addPack(root, p); });

  root.onclick = e => {
    const el = e.target.closest('[data-act]'); if(!el) return;
    const act = el.dataset.act, id = el.dataset.id, i = Number(el.dataset.i);
    if(act === 'back'){ state.tripId = null; renderTrip(root); }
    else if(act === 'editTrip'){
      openForm('编辑旅行计划', [
        { key: 'dest', label: '目的地', value: p.dest, required: true },
        { key: 'start', label: '出发日期', type: 'date', value: p.start, required: true },
        { key: 'end', label: '返回日期', type: 'date', value: p.end, required: true },
        { key: 'budget', label: '预算（元）', type: 'number', value: p.budget, step: '1' }
      ], data => {
        Object.assign(p, data, { budget: Number(data.budget) || 0 });
        save(); toast('已保存'); renderTrip(root);
      });
    }
    else if(act === 'saveDays'){
      const map = {};
      $$('[data-day]', root).forEach(ta => { const v = ta.value.trim(); if(v) map[ta.dataset.day] = v; });
      p.days = map; save(); toast('行程已保存');
    }
    else if(act === 'addPack'){ addPack(root, p); }
    else if(act === 'togglePack'){ p.pack[i].done = !p.pack[i].done; save(); renderTrip(root); }
    else if(act === 'delPack'){ p.pack.splice(i, 1); save(); toast('已删除'); renderTrip(root); }
    else if(act === 'addNote'){
      openForm('写旅行笔记', [
        { key: 'date', label: '日期', type: 'date', value: today(), required: true },
        { key: 'text', label: '笔记内容', type: 'textarea', value: '', ph: '记录旅程中的见闻与感受', required: true }
      ], data => { p.notes.push({ id: uid(), date: data.date, text: data.text }); save(); toast('已添加笔记'); renderTrip(root); });
    }
    else if(act === 'editNote'){
      const n = p.notes.find(x => x.id === id);
      if(n) openForm('编辑旅行笔记', [
        { key: 'date', label: '日期', type: 'date', value: n.date, required: true },
        { key: 'text', label: '笔记内容', type: 'textarea', value: n.text, required: true }
      ], data => { n.date = data.date; n.text = data.text; save(); toast('已保存'); renderTrip(root); });
    }
    else if(act === 'delNote'){
      confirmBox('确定删除这条旅行笔记吗？').then(ok => {
        if(!ok) return;
        p.notes = p.notes.filter(x => x.id !== id); save(); toast('已删除'); renderTrip(root);
      });
    }
  };
}
function addPack(root, p){
  const inp = $('#packInput', root);
  const text = (inp.value || '').trim();
  if(!text){ toast('请输入物品名称'); inp.focus(); return; }
  p.pack.push({ text: text, done: false }); save(); toast('已添加物品'); renderTrip(root);
}
/* ===== 模块5：观影日记 ===== */
function renderMovie(root, keepFocus){
  if(state.movieFilter === undefined) state.movieFilter = 'all';
  if(state.movieQ === undefined) state.movieQ = '';
  const q = state.movieQ.trim().toLowerCase();
  const all = DB.movies.slice();
  const list = all.filter(m => {
    if(state.movieFilter !== 'all' && m.status !== state.movieFilter) return false;
    if(!q) return true;
    return (m.title || '').toLowerCase().indexOf(q) >= 0 || (m.review || '').toLowerCase().indexOf(q) >= 0;
  }).sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));

  const seenN = all.filter(m => m.status === 'seen').length;
  const wantN = all.filter(m => m.status === 'want').length;

  root.innerHTML = `
  <div class="page-head"><h2>观影日记</h2><span class="hint">已看 ${seenN} / 想看 ${wantN}</span></div>

  <div class="card">
    <h3>🔍 搜索与筛选</h3>
    <input id="movieQ" placeholder="搜索片名或观后感关键词" value="${esc(state.movieQ)}">
    <div class="chips mt">
      <div class="chip${state.movieFilter === 'all' ? ' on' : ''}" data-act="filter" data-f="all">全部 (${all.length})</div>
      <div class="chip${state.movieFilter === 'seen' ? ' on' : ''}" data-act="filter" data-f="seen">已看 (${seenN})</div>
      <div class="chip${state.movieFilter === 'want' ? ' on' : ''}" data-act="filter" data-f="want">想看 (${wantN})</div>
    </div>
    <button class="btn block mt" data-act="addMovie">＋ 新增观影记录</button>
  </div>

  <div class="card">
    <h3>🎬 记录列表 <span class="tag">${list.length} 条</span></h3>
    <div class="list">
      ${list.length ? list.map(m => `
        <div class="item">
          <div class="item-main">
            <div class="t">${esc(m.title)}
              <span class="tag${m.status === 'want' ? ' warn' : ''}">${m.status === 'want' ? '想看' : '已看'}</span></div>
            <div class="m"><span>${esc(m.date || '未填日期')}</span><span class="stars" style="font-size:14px;cursor:default">
              ${[1, 2, 3, 4, 5].map(n => `<span class="s${n <= (Number(m.rating) || 0) ? ' on' : ''}">★</span>`).join('')}</span>
              <span>${(Number(m.rating) || 0)} 星</span></div>
            ${m.review ? `<div class="m pre">${esc(m.review)}</div>` : ''}
          </div>
          <div class="item-actions">
            <button class="mini" data-act="editMovie" data-id="${m.id}" aria-label="编辑">✏️</button>
            <button class="mini" data-act="delMovie" data-id="${m.id}" aria-label="删除">🗑️</button>
          </div>
        </div>`).join('')
      : `<div class="empty"><span class="big">🎬</span>${all.length ? '没有符合条件的记录' : '还没有观影记录，快去添加第一部吧'}</div>`}
    </div>
  </div>`;

  const qi = $('#movieQ', root);
  qi.addEventListener('input', () => { state.movieQ = qi.value; renderMovie(root, true); });
  if(keepFocus){ qi.focus(); const v = qi.value; qi.setSelectionRange(v.length, v.length); }

  const form = (item) => openForm(item ? '编辑观影记录' : '新增观影记录', [
    { key: 'title', label: '名称', value: item ? item.title : '', ph: '电影 / 剧集名称', required: true },
    { key: 'date', label: '观看日期', type: 'date', value: item ? item.date : today(), required: true },
    { key: 'status', label: '分类标记', type: 'select', value: item ? item.status : 'seen',
      options: [{ v: 'seen', label: '已看' }, { v: 'want', label: '想看' }] },
    { key: 'rating', label: '评分（1-5 星）', type: 'select', value: item ? item.rating : 4,
      options: [1, 2, 3, 4, 5].map(n => ({ v: n, label: '★'.repeat(n) + '（' + n + ' 星）' })) },
    { key: 'review', label: '观后感', type: 'textarea', value: item ? item.review : '', ph: '写下你的感受与评价' }
  ], data => {
    const payload = { title: data.title, date: data.date, status: data.status, rating: Number(data.rating) || 0, review: data.review };
    if(item) Object.assign(item, payload);
    else DB.movies.push(Object.assign({ id: uid() }, payload));
    save(); toast(item ? '已保存' : '已添加观影记录'); renderMovie(root);
  });

  root.onclick = e => {
    const el = e.target.closest('[data-act]'); if(!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    const item = DB.movies.find(x => x.id === id);
    if(act === 'filter'){ state.movieFilter = el.dataset.f; renderMovie(root); }
    else if(act === 'addMovie') form(null);
    else if(act === 'editMovie' && item) form(item);
    else if(act === 'delMovie' && item){
      confirmBox('确定删除「' + item.title + '」的观影记录吗？').then(ok => {
        if(!ok) return;
        DB.movies = DB.movies.filter(x => x.id !== id); save(); toast('已删除'); renderMovie(root);
      });
    }
  };
}
/* ===== 模块6：收支账本 ===== */
function renderLedger(root){
  if(!state.ledgerMonth) state.ledgerMonth = monthKey(today());
  if(!DB.privCats || !DB.privCats.length) DB.privCats = ['餐饮', '日用品', '交通', '购物', '其他'];
  const mk = state.ledgerMonth;
  const monthRecs = DB.ledger.filter(x => monthKey(x.date) === mk);
  const pubTotal = monthRecs.filter(x => x.kind === 'public').reduce((s, x) => s + Number(x.amount || 0), 0);
  const privTotal = monthRecs.filter(x => x.kind === 'private').reduce((s, x) => s + Number(x.amount || 0), 0);
  const kind = state.ledgerKind;
  const list = monthRecs.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)) || (b.createdAt || 0) - (a.createdAt || 0));

  root.innerHTML = `
  <div class="page-head"><h2>收支账本</h2><span class="hint">累计 ${DB.ledger.length} 笔</span></div>

  <div class="card">
    <h3>📊 统计面板 <span class="tag gray">${esc(mk)}</span></h3>
    <input type="month" id="ledMonth" value="${mk}">
    <div class="kcal mt">
      <div class="kpi"><b>¥${money(pubTotal)}</b><span>公用转出</span></div>
      <div class="kpi"><b>¥${money(privTotal)}</b><span>私用支出</span></div>
      <div class="kpi"><b>¥${money(pubTotal + privTotal)}</b><span>合计总流出</span></div>
    </div>
    <canvas id="ledPie"></canvas>
    <p class="sub center mt">本月共 ${monthRecs.length} 笔记录，饼图展示公用与私用占比</p>
  </div>

  <div class="card">
    <h3>➕ 记一笔</h3>
    <div class="chips">
      <div class="chip${kind === 'public' ? ' on' : ''}" data-act="kind" data-k="public">公用转出</div>
      <div class="chip${kind === 'private' ? ' on' : ''}" data-act="kind" data-k="private">私用支出</div>
    </div>
    <label class="fl" id="pubField" style="display:${kind === 'public' ? 'block' : 'none'}"><span>转出用途</span>
      <input id="ledPurpose" placeholder="如：团队活动经费、公摊采购" maxlength="40"></label>
    <label class="fl" id="privField" style="display:${kind === 'private' ? 'block' : 'none'}"><span>支出小分类</span>
      <select id="ledCat">${DB.privCats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></label>
    <div class="grid2">
      <label class="fl"><span>金额（元）</span><input id="ledAmount" type="number" step="0.01" min="0" placeholder="0.00"></label>
      <label class="fl"><span>日期</span><input id="ledDate" type="date" value="${today()}"></label>
    </div>
    <label class="fl"><span>备注</span><textarea id="ledNote" placeholder="补充说明，可为空"></textarea></label>
    <button class="btn block mt" data-act="add">添加账目</button>
    <button class="btn small ghost block mt" data-act="editCats">自定义私用小分类</button>
  </div>

  <div class="card">
    <h3>🧾 ${esc(mk)} 明细 <span class="tag">${list.length} 笔</span></h3>
    <div class="list list-scroll">
      ${list.length ? list.map(x => `
        <div class="item">
          <div class="item-main">
            <div class="t">${x.kind === 'public' ? '🏢' : '🏠'} ${esc(x.kind === 'public' ? x.purpose : x.category)}</div>
            <div class="m"><span>${esc(x.date)}</span>
              <span class="tag${x.kind === 'public' ? '' : ' gray'}">${x.kind === 'public' ? '公用转出' : '私用支出'}</span></div>
            ${x.note ? `<div class="m pre">${esc(x.note)}</div>` : ''}
          </div>
          <div class="item-actions">
            <b style="color:${x.kind === 'public' ? 'var(--p2)' : 'var(--danger)'}">-¥${money(x.amount)}</b>
            <button class="mini" data-act="del" data-id="${x.id}" aria-label="删除">🗑️</button>
          </div>
        </div>`).join('')
      : `<div class="empty"><span class="big">💰</span>${esc(mk)} 还没有账目记录<br>在上方记下第一笔吧</div>`}
    </div>
  </div>`;

  // 饼图：公用 vs 私用
  chart($('#ledPie', root), 190, (ctx, w, h) => drawPie(ctx, w, h, [
    { label: '公用转出', value: pubTotal, color: cssVar('--p2') },
    { label: '私用支出', value: privTotal, color: cssVar('--p1') }
  ]));

  const lm = $('#ledMonth', root);
  lm.onchange = () => { state.ledgerMonth = lm.value || monthKey(today()); renderLedger(root); };

  root.onclick = e => {
    const el = e.target.closest('[data-act]'); if(!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    if(act === 'kind'){
      state.ledgerKind = el.dataset.k;
      $$('.chip[data-act="kind"]', root).forEach(c => c.classList.toggle('on', c.dataset.k === state.ledgerKind));
      $('#pubField', root).style.display = state.ledgerKind === 'public' ? 'block' : 'none';
      $('#privField', root).style.display = state.ledgerKind === 'private' ? 'block' : 'none';
    }
    else if(act === 'add'){ addLedger(root); }
    else if(act === 'editCats'){
      openForm('自定义私用小分类', [
        { key: 'cats', label: '分类列表（用中文逗号或英文逗号分隔）', type: 'textarea', value: DB.privCats.join('、'), required: true }
      ], data => {
        const arr = data.cats.split(/[,，、\s]+/).filter(Boolean);
        if(!arr.length){ toast('至少保留一个分类'); return; }
        DB.privCats = arr; save(); toast('分类已更新'); renderLedger(root);
      });
    }
    else if(act === 'del'){
      const item = DB.ledger.find(x => x.id === id);
      if(!item) return;
      confirmBox('确定删除这笔 ¥' + money(item.amount) + ' 的记录吗？').then(ok => {
        if(!ok) return;
        DB.ledger = DB.ledger.filter(x => x.id !== id); save(); toast('已删除'); renderLedger(root);
      });
    }
  };
}
function addLedger(root){
  const kind = state.ledgerKind;
  const amount = Number($('#ledAmount', root).value);
  const date = $('#ledDate', root).value || today();
  const note = $('#ledNote', root).value.trim();
  const purpose = $('#ledPurpose', root).value.trim();
  const category = $('#ledCat', root).value;
  if(!(amount > 0)){ toast('请输入正确的金额'); return; }
  if(kind === 'public' && !purpose){ toast('请填写转出用途'); return; }
  DB.ledger.push({ id: uid(), kind: kind, amount: amount, date: date, note: note,
    purpose: kind === 'public' ? purpose : '', category: kind === 'private' ? category : '', createdAt: Date.now() });
  save();
  state.ledgerMonth = monthKey(date);
  toast('已记录 ¥' + money(amount)); renderLedger(root);
}
/* ===== 模块8：心情日记 ===== */
const MOODS = ['😄', '😊', '😌', '😐', '😔', '😢', '😡', '🤩', '🥳', '😴', '😰', '🤔'];
function renderMood(root){
  const t = today();
  if(!state.moodMonth) state.moodMonth = monthKey(t);
  if(!state.moodSel) state.moodSel = t;
  const year = Number(state.moodMonth.slice(0, 4)), month = Number(state.moodMonth.slice(5, 7)) - 1;
  const map = {};
  DB.moods.forEach(m => { map[m.date] = m; });
  const cur = map[state.moodSel];
  const isToday = state.moodSel === t;

  // 月历格子
  const startW = (new Date(year, month, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const total = Math.ceil((startW + daysInMonth) / 7) * 7;
  let cells = '';
  for(let i = 0; i < total; i++){
    const dayNum = i - startW + 1;
    const dt = new Date(year, month, dayNum);
    const ds = ymd(dt), other = dayNum < 1 || dayNum > daysInMonth;
    const rec = map[ds];
    cells += `<div class="cal-cell${other ? ' other' : ''}${ds === t ? ' today' : ''}${ds === state.moodSel && ds !== t ? ' sel' : ''}"
      data-act="sel" data-date="${ds}">
      ${rec ? `<span class="em">${rec.mood || '📝'}</span><span class="n">${dt.getDate()}</span>`
            : `<span>${dt.getDate()}</span>`}
    </div>`;
  }

  const hist = DB.moods.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));

  root.innerHTML = `
  <div class="page-head"><h2>心情日记</h2><span class="hint">${hist.length} 篇日记</span></div>

  <div class="card">
    <h3>💗 ${esc(state.moodSel)} ${isToday ? '（今天）' : ''} 的心情</h3>
    <div class="mood-pick">
      ${MOODS.map(m => `<div class="m${cur && cur.mood === m ? ' on' : ''}" data-act="pick" data-m="${m}">${m}</div>`).join('')}
    </div>
    <label class="fl"><span>想说的话</span>
      <textarea id="moodText" placeholder="记录今天的心情与故事…">${esc(cur ? cur.text : '')}</textarea></label>
    <div class="row mt">
      <button class="btn" data-act="save">保存日记</button>
      ${cur ? '<button class="btn ghost" data-act="delCur">删除</button>' : ''}
    </div>
  </div>

  <div class="card">
    <div class="cal-head">
      <button class="mini" data-act="prevM">‹</button>
      <div class="ym">${year} 年 ${month + 1} 月</div>
      <button class="mini" data-act="nextM">›</button>
    </div>
    <div class="cal-grid">${weekdayCN.map(w => `<div class="cal-wk">${w}</div>`).join('')}</div>
    <div class="cal-grid mt">${cells}</div>
    <div class="row mt"><button class="btn small ghost block" data-act="backToday">回到今天</button></div>
    <p class="sub mt">有记录的日子会显示当天的心情 emoji，点击格子可查看或补写。</p>
  </div>

  <div class="card">
    <h3>📖 历史日记 <span class="tag">${hist.length} 篇</span></h3>
    <div class="list list-scroll">
      ${hist.length ? hist.map(m => `
        <div class="item">
          <div class="item-main">
            <div class="t">${m.mood || '📝'} ${esc(m.date)}</div>
            ${m.text ? `<div class="m pre">${esc(m.text)}</div>` : '<div class="m">只记录了心情 emoji</div>'}
          </div>
          <div class="item-actions">
            <button class="mini" data-act="open" data-date="${m.date}" aria-label="编辑">✏️</button>
            <button class="mini" data-act="del" data-date="${m.date}" aria-label="删除">🗑️</button>
          </div>
        </div>`).join('') : '<div class="empty"><span class="big">🌈</span>还没有日记<br>选择今天的心情开始记录吧</div>'}
    </div>
  </div>`;

  let pickedMood = cur ? cur.mood : '';
  $$('.mood-pick .m', root).forEach(el => {
    el.onclick = () => { pickedMood = el.dataset.m; $$('.mood-pick .m', root).forEach(x => x.classList.toggle('on', x === el)); };
  });

  root.onclick = e => {
    const el = e.target.closest('[data-act]'); if(!el) return;
    const act = el.dataset.act;
    if(act === 'prevM' || act === 'nextM'){
      const dt = new Date(year, month + (act === 'prevM' ? -1 : 1), 1);
      state.moodMonth = ymd(dt).slice(0, 7); renderMood(root);
    }
    else if(act === 'backToday'){ state.moodMonth = monthKey(t); state.moodSel = t; renderMood(root); }
    else if(act === 'sel'){ state.moodSel = el.dataset.date; state.moodMonth = monthKey(el.dataset.date); renderMood(root); }
    else if(act === 'save'){
      const text = $('#moodText', root).value.trim();
      if(!pickedMood && !text){ toast('请选择心情或写点什么'); return; }
      const rec = DB.moods.find(x => x.date === state.moodSel);
      if(rec){ rec.mood = pickedMood; rec.text = text; }
      else DB.moods.push({ date: state.moodSel, mood: pickedMood, text: text });
      save(); toast('日记已保存'); renderMood(root);
    }
    else if(act === 'delCur' || act === 'del'){
      const d = act === 'del' ? el.dataset.date : state.moodSel;
      confirmBox('确定删除 ' + d + ' 的心情日记吗？').then(ok => {
        if(!ok) return;
        DB.moods = DB.moods.filter(x => x.date !== d); save(); toast('已删除'); renderMood(root);
      });
    }
    else if(act === 'open'){ state.moodSel = el.dataset.date; state.moodMonth = monthKey(el.dataset.date); renderMood(root); window.scrollTo(0, 0); }
  };
}
/* ===== 模块9：目标清单 ===== */
function renderGoals(root){
  if(state.goalTab === undefined) state.goalTab = 'active';   // active | archived
  const t = today();
  const all = DB.goals.slice().sort((a, b) => String(a.deadline || '').localeCompare(String(b.deadline || '')));
  const list = all.filter(g => (state.goalTab === 'archived') === !!g.archived);

  const cardOf = g => {
    const subs = g.sub || [];
    const doneN = subs.filter(s => s.done).length;
    const pct = subs.length ? Math.round(doneN / subs.length * 100) : 0;
    const left = g.deadline ? daysBetween(t, g.deadline) : null;
    const finished = subs.length > 0 && doneN === subs.length;
    return `<div class="card">
      <h3>🎯 ${esc(g.title)}
        ${finished ? '<span class="tag">已完成</span>' : ''}
        ${left === null ? '' : `<span class="tag${left < 0 ? ' danger' : left <= 3 ? ' warn' : ' gray'}">
          ${left < 0 ? '已超期 ' + Math.abs(left) + ' 天' : left === 0 ? '今天截止' : '剩 ' + left + ' 天'}</span>`}</h3>
      <p class="sub">截止日期：${esc(g.deadline || '未设置')} · 子任务 ${doneN}/${subs.length} · 完成率 ${pct}%</p>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div class="list">
        ${subs.length ? subs.map((s, i) => `
          <div class="item">
            <div class="check ${s.done ? 'on' : ''}" data-act="toggleSub" data-id="${g.id}" data-i="${i}">
              <span class="box">✓</span><span class="lb">${esc(s.text)}</span>
            </div>
            <div class="item-actions"><button class="mini" data-act="delSub" data-id="${g.id}" data-i="${i}" aria-label="删除">🗑️</button></div>
          </div>`).join('') : '<div class="empty" style="padding:12px">还没有子任务，先拆分第一步吧</div>'}
      </div>
      <div class="row mt">
        <input id="sub-${g.id}" placeholder="添加一条子任务" maxlength="50">
        <button class="btn small" data-act="addSub" data-id="${g.id}" style="flex:0 0 auto">添加</button>
      </div>
      <div class="row mt">
        ${g.archived
          ? `<button class="btn small" data-act="unarchive" data-id="${g.id}">恢复</button>`
          : (finished ? `<button class="btn small ok" data-act="archive" data-id="${g.id}">归档</button>` : '')}
        <button class="btn small ghost" data-act="editGoal" data-id="${g.id}">编辑</button>
        <button class="btn small ghost" data-act="delGoal" data-id="${g.id}">删除</button>
      </div>
    </div>`;
  };

  root.innerHTML = `
  <div class="page-head"><h2>目标清单</h2>
    <span class="hint">进行中 ${all.filter(g => !g.archived).length} · 已归档 ${all.filter(g => g.archived).length}</span></div>

  <div class="card">
    <h3>➕ 新建目标</h3>
    <button class="btn block" data-act="addGoal">创建新目标</button>
    <div class="chips mt">
      <div class="chip${state.goalTab === 'active' ? ' on' : ''}" data-act="tab" data-t="active">进行中</div>
      <div class="chip${state.goalTab === 'archived' ? ' on' : ''}" data-act="tab" data-t="archived">已归档</div>
    </div>
  </div>

  ${list.length ? list.map(cardOf).join('')
    : `<div class="empty"><span class="big">🎯</span>${state.goalTab === 'archived' ? '还没有归档的目标' : '还没有目标<br>点击上方按钮创建第一个目标'}</div>`}`;

  list.forEach(g => {
    const inp = $('#sub-' + g.id, root);
    if(inp) inp.addEventListener('keydown', e => { if(e.key === 'Enter') addSub(root, g); });
  });

  const form = (item) => openForm(item ? '编辑目标' : '新建目标', [
    { key: 'title', label: '目标内容', value: item ? item.title : '', ph: '如：三个月内跑完半马', required: true },
    { key: 'deadline', label: '截止日期', type: 'date', value: item ? item.deadline : '', required: true }
  ], data => {
    if(item){ item.title = data.title; item.deadline = data.deadline; }
    else DB.goals.push({ id: uid(), title: data.title, deadline: data.deadline, sub: [], archived: false, createdAt: Date.now() });
    save(); toast(item ? '已保存' : '目标已创建'); renderGoals(root);
  });

  root.onclick = e => {
    const el = e.target.closest('[data-act]'); if(!el) return;
    const act = el.dataset.act, id = el.dataset.id, i = Number(el.dataset.i);
    const g = DB.goals.find(x => x.id === id);
    if(act === 'tab'){ state.goalTab = el.dataset.t; renderGoals(root); }
    else if(act === 'addGoal') form(null);
    else if(act === 'toggleSub' && g){ g.sub[i].done = !g.sub[i].done; save(); renderGoals(root); }
    else if(act === 'addSub' && g){ addSub(root, g); }
    else if(act === 'delSub' && g){ g.sub.splice(i, 1); save(); renderGoals(root); }
    else if(act === 'archive' && g){ g.archived = true; save(); toast('目标已归档'); renderGoals(root); }
    else if(act === 'unarchive' && g){ g.archived = false; state.goalTab = 'active'; save(); toast('已恢复到进行中'); renderGoals(root); }
    else if(act === 'editGoal' && g) form(g);
    else if(act === 'delGoal' && g){
      confirmBox('确定删除目标「' + g.title + '」吗？').then(ok => {
        if(!ok) return;
        DB.goals = DB.goals.filter(x => x.id !== g.id); save(); toast('已删除'); renderGoals(root);
      });
    }
  };
}
function addSub(root, g){
  const inp = $('#sub-' + g.id, root);
  const text = (inp.value || '').trim();
  if(!text){ toast('请输入子任务内容'); inp.focus(); return; }
  g.sub.push({ text: text, done: false }); save(); toast('已添加子任务'); renderGoals(root);
}

/* ===== 模块10：密码管理 ===== */
function renderVault(root, keepFocus){
  const q = (state.vaultQ || '').trim().toLowerCase();
  const list = DB.vault.filter(v => !q || (v.name || '').toLowerCase().indexOf(q) >= 0
    || (v.account || '').toLowerCase().indexOf(q) >= 0 || (v.note || '').toLowerCase().indexOf(q) >= 0);

  root.innerHTML = `
  <div class="page-head"><h2>密码管理</h2><span class="hint">共 ${DB.vault.length} 条</span></div>

  <div class="card">
    <h3>🔍 搜索</h3>
    <input id="vaultQ" placeholder="搜索名称、账号或备注" value="${esc(state.vaultQ || '')}">
    <button class="btn block mt" data-act="add">＋ 新增账号密码</button>
  </div>

  <div class="card">
    <h3>🗄️ 账号列表</h3>
    <div class="list list-scroll">
      ${list.length ? list.map(v => {
        const show = state.vaultShow[v.id];
        return `<div class="pw-row" style="display:block">
          <div style="display:flex;align-items:center;gap:8px">
            <div class="info">
              <div class="n">${esc(v.name)}</div>
              <div class="a">账号：${esc(v.account || '未填写')}</div>
              <div class="p">密码：${show ? esc(v.password) : '•'.repeat(Math.min(String(v.password || '').length, 12) || 6)}</div>
              ${v.note ? `<div class="a" style="font-family:inherit">备注：${esc(v.note)}</div>` : ''}
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;flex:0 0 auto">
              <button class="mini" data-act="eye" data-id="${v.id}" aria-label="显示密码">👁️</button>
              <button class="mini" data-act="edit" data-id="${v.id}" aria-label="编辑">✏️</button>
              <button class="mini" data-act="del" data-id="${v.id}" aria-label="删除">🗑️</button>
            </div>
          </div>
          <div class="row mt">
            <button class="btn small ghost" data-act="copyAcc" data-id="${v.id}">复制账号</button>
            <button class="btn small ghost" data-act="copyPwd" data-id="${v.id}">复制密码</button>
          </div>
        </div>`;
      }).join('') : `<div class="empty"><span class="big">🗄️</span>${DB.vault.length ? '没有匹配的记录' : '还没有保存任何账号密码'}</div>`}
    </div>
  </div>`;

  const qi = $('#vaultQ', root);
  qi.addEventListener('input', () => { state.vaultQ = qi.value; renderVault(root, true); });
  if(keepFocus){ qi.focus(); const v = qi.value; qi.setSelectionRange(v.length, v.length); }

  const form = (item) => openForm(item ? '编辑账号密码' : '新增账号密码', [
    { key: 'name', label: '名称', value: item ? item.name : '', ph: '如：某某网站 / 邮箱', required: true },
    { key: 'account', label: '账号', value: item ? item.account : '', ph: '用户名 / 手机号 / 邮箱', required: true },
    { key: 'password', label: '密码', value: item ? item.password : '', ph: '登录密码', required: true },
    { key: 'note', label: '备注', type: 'textarea', value: item ? item.note : '', ph: '如：绑定手机、密保问题' }
  ], data => {
    if(item) Object.assign(item, data);
    else DB.vault.push(Object.assign({ id: uid(), createdAt: Date.now() }, data));
    save(); toast(item ? '已保存' : '已新增记录'); renderVault(root);
  });

  root.onclick = e => {
    const el = e.target.closest('[data-act]'); if(!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    const item = DB.vault.find(x => x.id === id);
    if(act === 'add') form(null);
    else if(act === 'eye' && item){ state.vaultShow[id] = !state.vaultShow[id]; renderVault(root); }
    else if(act === 'edit' && item) form(item);
    else if(act === 'copyAcc' && item) copyText(item.account || '', '账号');
    else if(act === 'copyPwd' && item) copyText(item.password || '', '密码');
    else if(act === 'del' && item){
      confirmBox('确定删除「' + item.name + '」的账号记录吗？').then(ok => {
        if(!ok) return;
        DB.vault = DB.vault.filter(x => x.id !== id); save(); toast('已删除'); renderVault(root);
      });
    }
  };
}

/* ---------------- 9. 初始化 ---------------- */
(function init(){
  buildPages();
  applyTheme(DB.theme || 'light');
  $('#btnMenu').onclick = openDrawer;
  $('#mask').onclick = closeDrawer;
  $('#btnTheme').onclick = () => applyTheme(DB.theme === 'dark' ? 'light' : 'dark');
  $('#navList').addEventListener('click', e => {
    const item = e.target.closest('.nav-item');
    if(item) go(item.dataset.go);
  });
  $('#modalMask').addEventListener('click', e => { if(e.target === $('#modalMask')) closeModal(); });
  window.addEventListener('hashchange', () => {
    const id = location.hash.slice(1);
    if(id && id !== state.page && MODULES.some(m => m.id === id)) go(id, true);
  });
  go(location.hash.slice(1) || 'home', true);
})();
</script>
